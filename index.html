<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<style>
/* Layout: one-column phone app; sticky header, scrolling screen, fixed bottom tab bar, bottom sheets for editing */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#F5F8F5; --line:#DCE3DD;
  --ink:#14201A; --muted:#5C6B63;
  --accent:#0E6B4F; --accent-ink:#FFFFFF; --accent-soft:#D7EDE3;
  --in:#11804F; --out:#B23A33; --out-soft:#F6DEDB;
  --gold:#C08A1E;
  --cat-bg:#E4ECE7; --cat-ink:#2F4A3D;
  --hero-a:#0E6B4F; --hero-b:#0A4A37;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 6px 20px rgba(20,32,26,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --surface-2:#1B2721; --line:#2A3832;
  --ink:#E7EFEA; --muted:#93A59B;
  --accent:#3FBF8C; --accent-ink:#06150F; --accent-soft:#1D3A2E;
  --in:#4BCB8C; --out:#F07A70; --out-soft:#3A1F1D; --gold:#E2B04A; --cat-bg:#24332C; --cat-ink:#BFD3C8;
  --hero-a:#145C45; --hero-b:#0C382A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface-2:#1B2721; --line:#2A3832;
  --ink:#E7EFEA; --muted:#93A59B;
  --accent:#3FBF8C; --accent-ink:#06150F; --accent-soft:#1D3A2E;
  --in:#4BCB8C; --out:#F07A70; --out-soft:#3A1F1D; --gold:#E2B04A; --cat-bg:#24332C; --cat-ink:#BFD3C8;
  --hero-a:#145C45; --hero-b:#0C382A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.logo{width:40px;height:40px;flex:none;border-radius:11px;display:block}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--in)}
.photo{width:46px;height:46px;border-radius:50%;flex:none;border:2px solid var(--surface);box-shadow:var(--shadow);background:var(--accent-soft) center/cover no-repeat;display:grid;place-items:center;color:var(--accent);padding:0}
.photo svg{width:22px;height:22px}

.screen{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .sub{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.hero{background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:#F2FBF6;border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.06)}
.hero .label{color:rgba(242,251,246,.75)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em}
.hero .big.neg{color:#FFC9C4}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-row div{background:rgba(255,255,255,.09);border-radius:12px;padding:8px 10px;min-width:0}
.hero-row b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-row span{font-size:11px;color:rgba(242,251,246,.75)}
.hero-cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-cta button{border:0;border-radius:12px;padding:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-out{background:#FFFFFF;color:#7E241F}
.btn-in{background:rgba(255,255,255,.16);color:#F2FBF6}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:19px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.in b{color:var(--in)} .stat.out b{color:var(--out)}
.equation{font-size:13px;color:var(--muted);margin-top:10px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;position:relative;font-family:var(--f-display);font-weight:800;line-height:1;overflow:visible}
.ico svg{width:20px;height:20px}
.ico.cat{background:var(--cat-bg);color:var(--cat-ink)}
.ico.brand{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.ico .dir{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-body);font-size:10px;font-weight:800;border:2px solid var(--surface)}
.ico .dir.in{background:var(--in);color:#fff} .ico .dir.out{background:var(--out);color:#fff}
.ico.sm{width:26px;height:26px;border-radius:8px}
.ico.sm svg{width:15px;height:15px}
.bar-row .t{display:flex;align-items:center;gap:8px}
.bar-row .t>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.descwrap{display:flex;gap:10px;align-items:center}
.descwrap input{flex:1}
#descIco{flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:12.5px;color:var(--muted)}
.row .amt{text-align:right;flex:none}
.row .amt b{display:block;font-weight:700}
.row .amt b.in{color:var(--in)} .row .amt b.out{color:var(--out)}
.row .amt span{font-size:12px;color:var(--muted)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 4px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.dayhead:first-child{padding-top:0}
.bf{display:flex;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:18px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}

.count-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.count-grid div{background:var(--surface-2);border-radius:12px;padding:10px;min-width:0}
.count-grid b{font-family:var(--f-display);font-size:24px;font-weight:800;display:block;line-height:1.1}
.count-grid span{font-size:11.5px;color:var(--muted)}
.count-line{font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:8px 0}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:6px}
.plane{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.bar-row .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar-row .v{font-weight:700}
.bar-row .b{grid-column:1/-1;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar-row .b i{display:block;height:100%;background:var(--out);border-radius:5px}
.chartwrap{overflow-x:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--out)}
.chart .bar.today{fill:var(--gold)}

.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;font-size:16px;-webkit-appearance:none;appearance:none}
.field input[type=date]{min-height:48px}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.seg button.on.out{background:var(--out);color:#fff}
.seg button.on.in{background:var(--in);color:#fff}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.danger.sure{background:var(--out);color:#fff}
.btn:disabled{opacity:.55}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .add{position:relative;top:-14px}
nav.tabs .add span{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
nav.tabs .add svg{width:28px;height:28px}

.scrim{position:fixed;inset:0;background:rgba(8,14,11,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92%;overflow-y:auto;animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head><body>
<div class="app">
  <header class="top">
    <img class="logo" src="icon-96.png" alt="" width="40" height="40">
    <div class="brand">
      <h1 id="familyName">JEHA Family</h1>

    <button class="photo" id="photoBtn" aria-label="Change family photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <input type="file" id="photoInput" accept="image/*" hidden>
  </header>

  <main id="screen" class="screen"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
    <button data-tab="ledger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Ledger</button>
    <button class="add" id="addTab" aria-label="Add entry"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Report</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </div>
</nav>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";
const DEFAULT_SETTINGS={family:"JEHA Family",currency:"",arrival:"2026-08-10",departure:"2027-01-07",people:["Samer"],photo:""};
const STARTING_ENTRIES=[
  {date:"2026-09-30",type:"in",desc:"neo balance",amount:3000},
  {date:"2026-10-01",type:"out",desc:"expenses oct",amount:200},
  {date:"2026-10-02",type:"out",desc:"expenses oct",amount:1100},
  {date:"2026-10-02",type:"in",desc:"salary SEPT",amount:6600},
  {date:"2026-10-02",type:"out",desc:"carpenter",amount:500},
  {date:"2026-10-05",type:"out",desc:"my parents",amount:500},
  {date:"2026-10-07",type:"out",desc:"donation",amount:200},
  {date:"2026-10-12",type:"out",desc:"carpenter",amount:600},
  {date:"2026-10-12",type:"out",desc:"expenses oct",amount:1500}
];
const CACHE_KEY="jeha-cashbook-cache-v1", LOCAL_KEY="jeha-cashbook-local-v1", TAB_KEY="jeha-cashbook-tab";

const S={entries:[],settings:{...DEFAULT_SETTINGS},mode:"loading",tab:"home",month:null,loaded:false,db:null};

function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- dates & numbers ---------- */
const pad=n=>String(n).padStart(2,"0");
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/864e5)}
function dim(mk){const [y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate()}
function shiftMonth(mk,n){const [y,m]=mk.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthName(mk){const [y,m]=mk.split("-").map(Number);return MONTHS[m-1]+" "+y}
function prettyDate(s,withYear){const d=parseISO(s);return d.toLocaleDateString("en-GB",withYear?{weekday:"short",day:"numeric",month:"short",year:"numeric"}:{weekday:"short",day:"numeric",month:"short"})}
function money(n,sign){const cur=S.settings.currency?S.settings.currency+" ":"";const v=Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:2});const s=n<0?"−":(sign&&n>0?"+":"");return s+cur+v}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* ---------- money maths ---------- */
function sorted(){return S.entries.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0))}
function monthSummary(mk){
  const start=mk+"-01";let bf=0,rec=0,paid=0;const items=[];
  for(const e of sorted()){
    const v=Number(e.amount)||0;
    if(e.date<start){bf+=e.type==="in"?v:-v}
    else if(e.date.slice(0,7)===mk){items.push(e);if(e.type==="in")rec+=v;else paid+=v}
  }
  const left=bf+rec-paid, days=dim(mk), today=todayISO(), tm=today.slice(0,7);
  let elapsed,remaining;
  if(mk===tm){const d=Number(today.slice(8));elapsed=d;remaining=days-d+1}
  else if(mk<tm){elapsed=days;remaining=0}
  else{elapsed=0;remaining=days}
  return{bf,rec,paid,left,items,days,elapsed,remaining,avg:elapsed?paid/elapsed:0,perDay:remaining?left/remaining:0};
}

const OWNER="samergeha83", REPO="cashbook-data", FILE="data.json";
const API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+FILE;
const KEY_LS="jeha-cashbook-key";
let KEY=null, SHA=null, ETAG=null, pulling=false, writing=0;

function getKey(){
  const m=location.hash.match(/k=([A-Za-z0-9_]+)/);
  if(m){lsSet(KEY_LS,m[1]);return m[1]}
  const k=lsGet(KEY_LS);
  // keep the key in the address so "Add to Home Screen" carries it to the app
  if(k){try{history.replaceState(null,"",location.pathname+location.search+"#k="+k)}catch(e){}}
  return k;
}
function b64enc(str){const by=new TextEncoder().encode(str);let bin="";for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(b){const bin=atob(String(b).replace(/\s/g,""));const by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder().decode(by)}
function hdrs(extra){return Object.assign({Authorization:"Bearer "+KEY,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},extra||{})}
function httpErr(r){const e=new Error("http "+r.status);e.status=r.status;return e}

async function pull(useEtag){
  const h=hdrs(useEtag&&ETAG?{"If-None-Match":ETAG}:null);
  const r=await fetch(API+"?t="+Date.now(),{cache:"no-store",headers:h});
  if(r.status===304)return null;
  if(!r.ok)throw httpErr(r);
  ETAG=r.headers.get("ETag");
  const j=await r.json();
  let text=j.content?b64dec(j.content):"";
  if(!text&&j.size>0){const r2=await fetch(API+"?t="+Date.now(),{cache:"no-store",headers:hdrs({Accept:"application/vnd.github.raw+json"})});if(!r2.ok)throw httpErr(r2);text=await r2.text()}
  SHA=j.sha;
  const d=JSON.parse(text||"{}");
  return{entries:Array.isArray(d.entries)?d.entries:[],settings:{...DEFAULT_SETTINGS,...(d.settings||{})}};
}
const MINE=new Set();
function announceNew(d){
  if(!S.loaded)return;
  const had=new Set(S.entries.map(x=>x.id));
  const fresh=d.entries.filter(x=>!had.has(x.id)&&!MINE.has(x.id));
  if(!fresh.length)return;
  const e=fresh[fresh.length-1];
  toast(fresh.length>1?fresh.length+" new entries from the family":"New: "+e.desc+" "+money(e.type==="in"?+e.amount:-e.amount,true)+(e.by?" · "+e.by:""));
}
function applyData(d){S.entries=d.entries;S.settings=d.settings;S.loaded=true;persistCache();render()}
async function refresh(loud){
  if(!KEY||pulling||writing)return;
  pulling=true;
  try{const d=await pull(!loud);S.mode="shared";if(d){announceNew(d);applyData(d)}else render();if(loud)toast("Up to date")}
  catch(e){S.mode=(e.status===401||e.status===403||e.status===404)?"badkey":"offline";render();if(loud)toast(failMsg(e))}
  finally{pulling=false}
}
async function mutate(fn,label){
  if(!KEY){const e=new Error("nokey");e.status=401;throw e}
  // show the change at once, then save it on top of the latest copy
  const local={entries:S.entries.map(x=>({...x})),settings:{...S.settings}};fn(local);S.entries=local.entries;S.settings=local.settings;render();
  writing++;
  try{
    for(let i=0;i<6;i++){
      const d=await pull(false);fn(d);
      const r=await fetch(API,{method:"PUT",headers:hdrs({"Content-Type":"application/json"}),body:JSON.stringify({message:label,content:b64enc(JSON.stringify({entries:d.entries,settings:d.settings},null,1)),sha:SHA})});
      if(r.ok){const j=await r.json();SHA=j.content&&j.content.sha;ETAG=null;S.mode="shared";applyData(d);return}
      if(r.status===409||r.status===422){await new Promise(res=>setTimeout(res,500+Math.random()*900));continue}
      throw httpErr(r);
    }
    throw new Error("busy");
  }catch(e){setTimeout(()=>refresh(false),0);throw e}
  finally{writing=Math.max(0,writing-1)}
}

async function boot(){
  const cached=lsGet(CACHE_KEY);
  const savedTab=lsGet(TAB_KEY);if(savedTab&&savedTab!=="family")S.tab=savedTab;
  if(cached){S.entries=cached.entries||[];S.settings={...DEFAULT_SETTINGS,...(cached.settings||{})}}
  KEY=getKey();
  if(!KEY){S.mode="nokey";render();return}
  render();
  await refresh(false);
  setInterval(()=>{if(document.visibilityState==="visible")refresh(false)},15000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh(false)});
  window.addEventListener("pageshow",()=>refresh(false));
}
function persistCache(){lsSet(CACHE_KEY,{entries:S.entries,settings:S.settings})}

async function writeEntry(e){
  MINE.add(e.id);
  await mutate(d=>{const i=d.entries.findIndex(x=>x.id===e.id);if(i>=0)d.entries[i]=e;else d.entries.push(e)},"Save: "+e.date+" "+e.desc+" "+e.amount);
}
async function removeEntry(id){
  await mutate(d=>{d.entries=d.entries.filter(x=>x.id!==id)},"Delete entry "+id);
}
async function writeSettings(next){
  await mutate(d=>{d.settings={...next}},"Update settings");
}
function failMsg(err){
  const c=err&&err.status;
  if(c===401||c===403||c===404)return "This phone isn't connected. Open the family link again.";
  if(err&&err.message==="busy")return "Someone else was saving at the same moment. Try again.";
  return "Couldn't save. Check your connection and try again.";
}

  // don't wipe a field someone is typing in when live data arrives
  const a=document.activeElement;
  if(a&&$("#screen").contains(a)&&/^(INPUT|SELECT)$/.test(a.tagName))return;
  const fn={home:homeView,ledger:ledgerView,report:reportView,settings:settingsView}[S.tab]||homeView;
  $("#screen").innerHTML=((S.mode==="nokey"||S.mode==="badkey")&&!S.entries.length)?emptyState():fn();
}

function entryRow(e,showDate){
  const by=e.by?" · "+esc(e.by):"";
  return `<button class="row" data-edit="${esc(e.id)}">
    ${iconFor(e.desc,e.type)}
    <span class="mid"><b>${esc(e.desc||"(no description)")}</b><span>${showDate?esc(prettyDate(e.date)):(e.type==="in"?"Money in":"Paid")}${by}</span></span>
    <span class="amt"><b class="num ${e.type}">${money(e.type==="in"?+e.amount:-e.amount,true)}</b>${e._bal!==undefined?`<span class="num">${money(e._bal)}</span>`:""}</span>
  </button>`;
}

function emptyState(){
  if(S.mode==="nokey"||S.mode==="badkey")
    return `<div class="card empty"><b>${S.mode==="badkey"?"The family link isn't working on this phone":"Connect this phone to the family cashbook"}</b><span>Open the family link Samer sent you, or paste it here.</span><div class="field" style="width:100%"><input id="linkIn" placeholder="Paste the family link" autocomplete="off" autocapitalize="off"></div><button class="btn" data-act="connect">Connect</button></div>`;
  if(S.mode==="shared"&&S.loaded&&!S.entries.length)
    return `<div class="card empty"><b>The cashbook is empty</b><span>Tap + to add the first entry.</span></div>`;
  return "";
}

function homeView(){
  const mk=todayISO().slice(0,7), m=monthSummary(mk);
  const recent=sorted().reverse().slice(0,6);
  return `${emptyState()}
  <section class="hero">
    <div><div class="label">Money left · ${esc(monthName(mk))}</div>
    <div class="big num ${m.left<0?"neg":""}">${money(m.left)}</div></div>
    <div class="hero-row">
      <div><b class="num">${money(m.perDay)}</b><span>can spend / day</span></div>
      <div><b class="num">${money(m.avg)}</b><span>avg spent / day</span></div>
      <div><b class="num">${m.remaining}</b><span>days left</span></div>
    </div>
    <div class="hero-cta">
      <button class="btn-out" data-act="add-out">↑ Paid today</button>
      <button class="btn-in" data-act="add-in">↓ Money in</button>
    </div>
  </section>
  ${countdownCard()}
  <section class="card">
    <h2>Latest entries <button class="chip" data-tab-go="ledger">Open ledger</button></h2>
    <div class="list">${recent.length?recent.map(e=>entryRow(e,true)).join(""):`<div class="empty">No entries yet. Tap + to add one.</div>`}</div>
  </section>`;
}

function countdownCard(){
  const st=S.settings,t=todayISO();
  if(!st.arrival||!st.departure)return "";
  const total=Math.max(1,daysBetween(st.arrival,st.departure));
  const passed=daysBetween(st.arrival,t), toGo=daysBetween(t,st.departure);
  let body;
  if(passed<0){
    body=`<div class="count-line"><span>Arrival is in <b>${-passed}</b> days</span><span>${esc(prettyDate(st.arrival,true))}</span></div>`;
  }else if(toGo<0){
    body=`<div class="count-line"><span>The trip ended ${-toGo} days ago.</span></div>`;
  }else{
    let mo=0,cur=parseISO(t);const end=parseISO(st.departure);
    while(true){const n=new Date(cur.getFullYear(),cur.getMonth()+1,cur.getDate());if(n<=end){mo++;cur=n}else break}
    const rd=Math.round((end-cur)/864e5);
    const pct=Math.min(100,Math.max(0,passed/total*100));
    body=`<div class="count-grid">
      <div><b class="num">${toGo}</b><span>days to go</span></div>
      <div><b class="num">${mo}<small style="font-size:14px">m</small> ${rd}<small style="font-size:14px">d</small></b><span>months + days</span></div>
      <div><b class="num">${Math.floor(toGo/7)}<small style="font-size:14px">w</small> ${toGo%7}<small style="font-size:14px">d</small></b><span>weeks + days</span></div>
    </div>
    <div class="count-line"><span><b class="num">${passed}</b> days passed of ${total}</span><span class="num">${Math.round(pct)}%</span></div>
    <div class="track" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
  }
  return `<section class="card">
    <h2>Vacation countdown <span class="sub">${esc(prettyDate(st.departure,true))}</span></h2>
    ${body}
    <div class="plane"><span>Arrived ${esc(prettyDate(st.arrival,true))}</span><span>Leaving</span></div>
  </section>`;
}

function monthBar(){
  return `<div class="monthbar">
    <button class="iconbtn" data-act="prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h3>${esc(monthName(S.month))}</h3>
    <button class="iconbtn" data-act="next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>`;
}

function ledgerView(){
  const m=monthSummary(S.month);
  let bal=m.bf;const days={};
  for(const e of m.items){bal+=e.type==="in"?+e.amount:-e.amount;(days[e.date]=days[e.date]||[]).push({...e,_bal:bal})}
  const keys=Object.keys(days).sort().reverse();
  const html=keys.map(k=>{const list=days[k];const end=list[list.length-1]._bal;
    return `<div class="dayhead"><span>${esc(prettyDate(k))}</span><span class="num">Balance ${money(end)}</span></div>
    <div class="list">${list.slice().reverse().map(e=>entryRow(e,false)).join("")}</div>`}).join("");
  return `${emptyState()}${monthBar()}
  <section class="card">
    <div class="stats">
      <div class="stat"><span class="label">Brought forward</span><b class="num">${money(m.bf)}</b></div>
      <div class="stat"><span class="label">Money left</span><b class="num">${money(m.left)}</b></div>
      <div class="stat in"><span class="label">Received</span><b class="num">${money(m.rec)}</b></div>
      <div class="stat out"><span class="label">Paid</span><b class="num">${money(m.paid)}</b></div>
    </div>
  </section>
  <section class="card">
    ${html||`<div class="empty">Nothing entered in ${esc(monthName(S.month))} yet.</div>`}
    <div class="bf" style="margin-top:12px"><span>Brought forward from ${esc(MONTHS[parseISO(shiftMonth(S.month,-1)+"-01").getMonth()])}</span><span class="num">${money(m.bf)}</span></div>
  </section>`;
}

function reportView(){
  const m=monthSummary(S.month);
  const groups={};
  for(const e of m.items)if(e.type==="out"){const k=(e.desc||"Other").trim().toLowerCase();(groups[k]=groups[k]||{name:(e.desc||"Other").trim(),v:0}).v+=+e.amount}
  const g=Object.values(groups).sort((a,b)=>b.v-a.v);const gmax=g.length?g[0].v:1;
  return `${monthBar()}
  <section class="card">
    <h2>Balance</h2>
    <div class="stats">
      <div class="stat"><span class="label">Money left</span><b class="num">${money(m.left)}</b></div>
      <div class="stat"><span class="label">Can spend / day</span><b class="num">${money(m.perDay)}</b></div>
      <div class="stat out"><span class="label">Avg spent / day</span><b class="num">${money(m.avg)}</b></div>
      <div class="stat"><span class="label">Days left</span><b class="num">${m.remaining} <small style="font-size:13px;color:var(--muted)">of ${m.days}</small></b></div>
    </div>
    <div class="equation num">${money(m.bf)} brought forward + ${money(m.rec)} received − ${money(m.paid)} paid = <b style="color:var(--ink)">${money(m.left)}</b></div>
  </section>
  <section class="card">
    <h2>Paid each day</h2>
    ${dailyChart(m)}
  </section>
  <section class="card">
    <h2>Spending by item <span class="sub num">${money(m.paid)} total</span></h2>
    <div class="bars">${g.length?g.map(x=>`<div class="bar-row"><span class="t">${iconFor(x.name,null,true)}<span>${esc(x.name)}</span></span><span class="v num">${money(x.v)}</span><span class="b"><i style="width:${(x.v/gmax*100).toFixed(1)}%"></i></span></div>`).join(""):`<div class="empty">No payments in ${esc(monthName(S.month))}.</div>`}</div>
  </section>`;
}

function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
function dailyChart(m){
  const per=new Array(m.days).fill(0);
  for(const e of m.items)if(e.type==="out")per[Number(e.date.slice(8))-1]+=+e.amount;
  const step=niceMax(Math.max(...per)/5),ticks=Math.max(1,Math.ceil(Math.max(...per)/step)),max=step*ticks;
  const W=340,H=170,L=38,R=6,T=10,B=22,cw=(W-L-R)/m.days;
  const y=v=>T+(H-T-B)*(1-v/max);
  const today=todayISO();const tm=today.slice(0,7)===S.month?Number(today.slice(8)):-1;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Amount paid each day of ${esc(monthName(S.month))}">`;
  for(let i=0;i<=ticks;i++){const v=step*i,yy=y(v);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${v>=1000?(v/1000)+"k":v}</text>`}
  per.forEach((v,i)=>{if(v>0){const yy=y(v);s+=`<rect class="bar${i+1===tm?" today":""}" x="${L+i*cw+cw*.15}" y="${yy}" width="${cw*.7}" height="${H-B-yy}" rx="1.5"><title>${i+1}: ${money(v)}</title></rect>`}});
  [1,5,10,15,20,25,m.days].forEach(d=>{s+=`<text x="${L+(d-.5)*cw}" y="${H-6}" text-anchor="middle">${d}</text>`});
  return `<div class="chartwrap">${s}</svg></div>`;
}

function settingsView(){
  const st=S.settings;
  return `<section class="card">
    <h2>Family</h2>
    <form class="form" id="settingsForm">
      <div class="field"><label for="sFamily">Name shown at the top</label><input id="sFamily" value="${esc(st.family)}" maxlength="40"></div>
      <div class="field"><label for="sCurrency">Currency sign</label><input id="sCurrency" value="${esc(st.currency)}" maxlength="6" placeholder="e.g. ₪, $, €, AED"></div>
      <div class="field"><label for="sPeople">Family members (comma separated)</label><input id="sPeople" value="${esc((st.people||[]).join(", "))}" placeholder="Samer, …"></div>
      <h2 style="margin:6px 0 0">Vacation</h2>
      <div class="field"><label for="sArrival">Arrival date</label><input type="date" id="sArrival" value="${esc(st.arrival)}"></div>
      <div class="field"><label for="sDeparture">Day to go</label><input type="date" id="sDeparture" value="${esc(st.departure)}"></div>
      <button class="btn" type="submit">Save settings</button>
    </form>
  </section>
  <section class="card">
    <h2>Family photo</h2>
    <div class="btnrow"><button class="btn ghost" data-act="photo">Choose photo</button>${st.photo?`<button class="btn danger" data-act="photo-remove">Remove photo</button>`:""}</div>
  </section>
  <section class="card">
    <h2>About this cashbook</h2>
    <p class="note" style="margin:0">${S.mode==="shared"
      ?"Every change saves straight away for the whole family. Other phones pick it up within about 15 seconds, or as soon as the app is opened."
      :"This phone isn't connected to the shared cashbook yet. Open the family link Samer sent you."}
    <br><br>On iPhone: open the family link in Safari, tap Share, then Add to Home Screen. The JEHA logo becomes the app icon.</p>
    <div class="btnrow" style="margin-top:12px"><button class="btn ghost" data-act="refresh">Refresh now</button></div>
  </section>`;
}

/* ---------- sheets ---------- */
function closeSheet(){$("#sheetHost").innerHTML=""}
function openEntry(entry){
  const isNew=!entry;
  const e=entry?{...entry}:{id:uid(),type:"out",date:todayISO(),desc:"",amount:"",by:(S.settings.people||[])[0]||""};
  const descs=[...new Set(S.entries.map(x=>(x.desc||"").trim()).filter(Boolean))];
  const people=(S.settings.people||[]).filter(Boolean);
  $("#sheetHost").innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <h2 id="sheetTitle">${isNew?"New entry":"Edit entry"}</h2>
    <form class="form" id="entryForm">
      <div class="seg" role="group" aria-label="Type">
        <button type="button" data-type="out" class="out ${e.type==="out"?"on":""}">↑ Paid</button>
        <button type="button" data-type="in" class="in ${e.type==="in"?"on":""}">↓ Money in</button>
      </div>
      <div class="field"><label for="eAmount">Amount${S.settings.currency?" ("+esc(S.settings.currency)+")":""}</label><input id="eAmount" inputmode="decimal" autocomplete="off" value="${esc(e.amount)}" placeholder="0" required></div>
      <div class="field"><label for="eDesc">Description</label><div class="descwrap"><span id="descIco">${iconFor(e.desc,null)}</span><input id="eDesc" list="descList" autocomplete="off" value="${esc(e.desc)}" placeholder="e.g. groceries" required></div><datalist id="descList">${descs.map(d=>`<option value="${esc(d)}">`).join("")}</datalist></div>
      <div class="field"><label for="eDate">Date</label><input type="date" id="eDate" value="${esc(e.date)}" required><span class="hint" id="dateHint"></span></div>
      ${people.length?`<div class="field"><label>Added by</label><div class="chips" id="byChips">${["",...people].map(p=>`<button type="button" class="chip ${p===(e.by||"")?"on":""}" data-by="${esc(p)}">${p?esc(p):"Nobody"}</button>`).join("")}</div></div>`:""}
      <div class="btnrow"><button class="btn" type="submit">${isNew?"Add entry":"Save changes"}</button></div>
      ${isNew?"":`<div class="btnrow"><button class="btn danger" type="button" id="delBtn">Delete entry</button></div>`}
      <div class="btnrow"><button class="btn ghost" type="button" data-act="close-btn">Cancel</button></div>
    </form></div></div>`;
  const form=$("#entryForm");
  const hint=()=>{const d=$("#eDate").value,h=$("#dateHint");
    if(e.type==="in"&&d&&Number(d.slice(8))>10){h.textContent="Money in is normally dated between the 1st and the 10th.";h.className="hint warn"}
    else{h.textContent="";h.className="hint"}};
  form.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{e.type=b.dataset.type;form.querySelectorAll("[data-type]").forEach(x=>x.classList.toggle("on",x===b));hint()});
  form.querySelectorAll("[data-by]").forEach(b=>b.onclick=()=>{e.by=b.dataset.by;form.querySelectorAll("[data-by]").forEach(x=>x.classList.toggle("on",x===b))});
  $("#eDate").addEventListener("change",hint);hint();
  const icoUp=()=>{$("#descIco").innerHTML=iconFor($("#eDesc").value,null)};
  $("#eDesc").addEventListener("input",icoUp);$("#eDesc").addEventListener("change",icoUp);
  form.onsubmit=async ev=>{
    ev.preventDefault();
    const amt=parseFloat($("#eAmount").value.replace(/,/g,""));
    if(!(amt>0)){toast("Enter an amount above zero.");$("#eAmount").focus();return}
    const desc=$("#eDesc").value.trim();if(!desc){toast("Add a short description.");return}
    const date=$("#eDate").value;if(!date){toast("Pick a date.");return}
    const out={id:e.id,type:e.type,date,desc,amount:Math.round(amt*100)/100,by:e.by||"",created:e.created||Date.now()};
    closeSheet();
    try{await writeEntry(out);toast(isNew?"Entry added":"Entry saved");S.month=date.slice(0,7)}catch(err){toast(failMsg(err))}
  };
  const del=$("#delBtn");
  if(del)del.onclick=async()=>{
    if(!del.classList.contains("sure")){del.classList.add("sure");del.textContent="Tap again to delete";return}
    closeSheet();
    try{await removeEntry(e.id);toast("Entry deleted")}catch(err){toast(failMsg(err))}
  };
  setTimeout(()=>{if(isNew)$("#eAmount")&&$("#eAmount").focus()},250);
}

let toastT;
function toast(msg){$("#toastHost").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$("#toastHost").innerHTML="",2600)}

/* ---------- photo ---------- */
function shrinkPhoto(file){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const size=320,c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
    const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
    res(c.toDataURL("image/jpeg",0.82))};img.src=r.result};r.readAsDataURL(file)})}
$("#photoBtn").onclick=()=>$("#photoInput").click();
$("#photoInput").onchange=async ev=>{
  const f=ev.target.files&&ev.target.files[0];ev.target.value="";if(!f)return;
  try{const photo=await shrinkPhoto(f);await writeSettings({...S.settings,photo});toast("Photo updated")}
  catch(err){toast(err&&err.code?failMsg(err):"That photo couldn't be opened. Try a JPEG or PNG.")}
};

/* ---------- events ---------- */
document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;lsSet(TAB_KEY,S.tab);if(document.activeElement)document.activeElement.blur();render();window.scrollTo(0,0)});
$("#addTab").onclick=()=>openEntry(null);
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-act],[data-edit],[data-tab-go]");
  if(!t)return;
  if(t.dataset.edit){const e=S.entries.find(x=>x.id===t.dataset.edit);if(e)openEntry(e);return}
  if(t.dataset.tabGo){S.tab=t.dataset.tabGo;lsSet(TAB_KEY,S.tab);render();window.scrollTo(0,0);return}
  const a=t.dataset.act;
  if(a==="close"&&ev.target===t)closeSheet();
  else if(a==="close-btn")closeSheet();
  else if(a==="add-out"||a==="add-in"){openEntry(null);const b=document.querySelector(`#entryForm [data-type="${a==="add-in"?"in":"out"}"]`);b&&b.click()}
  else if(a==="refresh"){refresh(false)}
  else if(a==="prev"){S.month=shiftMonth(S.month,-1);render()}
  else if(a==="next"){S.month=shiftMonth(S.month,1);render()}
  else if(a==="photo")$("#photoInput").click();
  else if(a==="photo-remove"){try{await writeSettings({...S.settings,photo:""});toast("Photo removed")}catch(err){toast(failMsg(err))}}
  else if(a==="connect"){const v=($("#linkIn")&&$("#linkIn").value||"").trim();const m=v.match(/k=([A-Za-z0-9_]+)/)||v.match(/^([A-Za-z0-9_]{30,})$/);if(!m){toast("That doesn't look like the family link.");return}lsSet(KEY_LS,m[1]);location.replace(location.pathname+"#k="+m[1]);location.reload()}
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="settingsForm")return;
  ev.preventDefault();
  if(document.activeElement)document.activeElement.blur();
  const next={...S.settings,
    family:$("#sFamily").value.trim()||"Family Cashbook",
    currency:$("#sCurrency").value.trim(),
    people:$("#sPeople").value.split(",").map(s=>s.trim()).filter(Boolean),
    arrival:$("#sArrival").value||S.settings.arrival,
    departure:$("#sDeparture").value||S.settings.departure};
  try{await writeSettings(next);toast("Settings saved")}catch(err){toast(failMsg(err))}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeSheet()});

boot();
})();
</script>

</body></html>
